name: Deploy Affiliate Platform (dev)

on:
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  # ==========================================
  # JOB 1: Build & Push Docker Images
  # ==========================================
  build-and-push:
    name: 📦 Build & Push Docker Images
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
      packages: write

    steps:
      - name: 🔄 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Build & Push Server
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/partner-server-dev:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/partner-server-dev:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 📦 Build & Push Client
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/partner-client-dev:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/partner-client-dev:latest
          build-args: |
            VITE_CLERK_PUBLISHABLE_KEY=${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_SHOW_DEV_BANNER=${{ vars.VITE_SHOW_DEV_BANNER }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # JOB 2: Deploy to VPS via SSH
  # ==========================================
  deploy:
    name: 🚀 Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
      packages: read

    steps:
      - name: 🔄 Checkout repository
        uses: actions/checkout@v4

      - name: 🚛 Upload docker-compose.dev.yml to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "docker-compose.dev.yml"
          target: "/opt/dev.jinn-travel.com"

      - name: 🚀 Execute remote deployment
        uses: appleboy/ssh-action@v0.1.10
        env:
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          IMAGE_TAG: ${{ github.sha }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: DATABASE_URL,GITHUB_REPOSITORY_OWNER,IMAGE_TAG,GHCR_READ_TOKEN,GITHUB_ACTOR
          script: |
            set -e
            cd /opt/dev.jinn-travel.com

            echo "$GHCR_READ_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            export GITHUB_REPOSITORY_OWNER="$GITHUB_REPOSITORY_OWNER"
            export DATABASE_URL="$DATABASE_URL"
            export IMAGE_TAG="$IMAGE_TAG"

            docker compose -f docker-compose.dev.yml pull
            docker compose -f docker-compose.dev.yml up -d --remove-orphans

            docker image prune -af --filter until=72h

  # ==========================================
  # JOB 3: Notification in Telegram
  # ==========================================
  notify:
    name: 📩 Send Notification
    needs: [build-and-push, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 📩 Notify in Telegram
        run: |
          BUILD_STATUS="${{ needs.build-and-push.result }}"
          DEPLOY_STATUS="${{ needs.deploy.result }}"

          if [ "$BUILD_STATUS" = "success" ] && [ "$DEPLOY_STATUS" = "success" ]; then
            MESSAGE="🚧 *Dev deploy successful!* 🚀%0A🌍 [Development](https://dev.jinn-travel.com)%0A👤 Author: ${{ github.actor }}%0A🔖 Commit: \`${{ github.sha }}\`"
          else
            MESSAGE="❌ *Dev deploy failed!*%0A👤 Author: ${{ github.actor }}%0A⚙️ Build: $BUILD_STATUS | Deploy: $DEPLOY_STATUS"
          fi

          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -H "Content-Type: application/json" \
            -d "{
              \"chat_id\": \"${{ secrets.TELEGRAM_CHAT_ID }}\",
              \"text\": \"$MESSAGE\",
              \"parse_mode\": \"Markdown\"
            }"
