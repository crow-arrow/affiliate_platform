name: Deploy Affiliate Platform (dev)

on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: 🔄 Git clone
        uses: actions/checkout@v3

      - name: 🧩 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "22"

      - name: ♻️ Cache node_modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('client/package-lock.json', 'server/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # ========================
      # FRONTEND BUILD
      # ========================
      - name: 📦 Install frontend dependencies
        working-directory: client
        run: npm install --legacy-peer-deps

      - name: ⚙️ Build frontend
        working-directory: client
        run: npm run build

      # ========================
      # BACKEND TESTS
      # ========================
      - name: 📦 Install backend dependencies
        working-directory: server
        run: npm install --legacy-peer-deps

      # ========================
      # DEPLOY FRONTEND
      # ========================
      - name: 🧹 Clean target directory on server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            find /var/www/dev.jinn-travel.com/ -type f \( -name '*.js' -o -name '*.css' -o -name '*.html' -o -name '*.map' \) -delete
            rm -rf /var/www/dev.jinn-travel.com/assets

      - name: 🚀 Deploy frontend to dev server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "client/dist"
          target: "/var/www/dev.jinn-travel.com"
          strip_components: 2

      - name: 🔄 Restart nginx
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: sudo systemctl restart nginx

      # ========================
      # DEPLOY BACKEND
      # ========================
      - name: 🚛 Upload backend (server/)
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "server"
          target: "/opt/dev.jinn-travel.com"
          strip_components: 1

      - name: 📦 Install backend dependencies on server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd "/opt/dev.jinn-travel.com"
            npm install --production --legacy-peer-deps

      - name: 🔁 Restart PM2 backend process
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: sudo pm2 restart affiliate_server_dev

      # ========================
      # NOTIFICATION
      # ========================
      - name: 📩 Notify in Telegram
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }} \
            -H "Content-Type: application/json" \
            -d '{
              "chat_id": "${{ secrets.TELEGRAM_CHAT_ID }}",
              "text": "🚧 *Dev* build & deploy successful!*\n👤 Author: ${{ github.actor }}\n💬 Commit: ${{ github.event.head_commit.message }}",
              "parse_mode": "Markdown"
            }'
