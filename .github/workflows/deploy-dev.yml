name: Deploy Affiliate Platform (dev)

on:
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  # ==========================================
  # JOB 1: Build & Push Docker Images
  # ==========================================
  build-and-push:
    name: 📦 Build & Push Docker Images
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
      packages: write

    steps:
      - name: 🔄 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Build & Push Server
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/partner-server-dev:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/partner-server-dev:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 📦 Build & Push Client
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/partner-client-dev:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/partner-client-dev:latest
          build-args: |
            VITE_CLERK_PUBLISHABLE_KEY=${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_SHOW_DEV_BANNER=${{ vars.VITE_SHOW_DEV_BANNER }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # JOB 2: Deploy to VPS via SSH
  # ==========================================
  deploy:
    name: 🚀 Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
      packages: read

    steps:
      - name: 🔄 Checkout repository
        uses: actions/checkout@v4

      - name: 🚛 Upload docker-compose.dev.yml to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "docker-compose.dev.yml"
          target: "/opt/dev.jinn-travel.com"

      - name: 🚀 Execute remote deployment
        uses: appleboy/ssh-action@v0.1.10
        env:
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_ACTOR: ${{ github.actor }}
          IMAGE_TAG: ${{ github.sha }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          PORT: ${{ vars.PORT || '3001' }}
          CLIENT_URL: ${{ vars.CLIENT_URL }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          ROOT_DOMAIN: ${{ vars.ROOT_DOMAIN }}
          UPLOAD_DIR: ${{ vars.UPLOAD_DIR || './uploads' }}
          EMAIL_HOST: ${{ vars.EMAIL_HOST }}
          EMAIL_PORT: ${{ vars.EMAIL_PORT || '465' }}
          EMAIL: ${{ vars.EMAIL }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: |
            GHCR_READ_TOKEN,GITHUB_REPOSITORY_OWNER,GITHUB_ACTOR,IMAGE_TAG,
            DATABASE_URL,JWT_SECRET,JWT_REFRESH_SECRET,EMAIL_PASSWORD,
            CLERK_SECRET_KEY,CLERK_PUBLISHABLE_KEY,
            PORT,CLIENT_URL,API_BASE_URL,ROOT_DOMAIN,UPLOAD_DIR,EMAIL_HOST,EMAIL_PORT,EMAIL
          script: |
            set -e
            cd /opt/dev.jinn-travel.com

            echo "$GHCR_READ_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            {
              echo "PORT=$PORT"
              echo "DATABASE_URL=$DATABASE_URL"
              echo "JWT_SECRET=$JWT_SECRET"
              echo "JWT_REFRESH_SECRET=$JWT_REFRESH_SECRET"
              echo "CLERK_SECRET_KEY=$CLERK_SECRET_KEY"
              echo "CLERK_PUBLISHABLE_KEY=$CLERK_PUBLISHABLE_KEY"
              echo "CLIENT_URL=$CLIENT_URL"
              echo "API_BASE_URL=$API_BASE_URL"
              echo "ROOT_DOMAIN=$ROOT_DOMAIN"
              echo "UPLOAD_DIR=$UPLOAD_DIR"
              echo "EMAIL_HOST=$EMAIL_HOST"
              echo "EMAIL_PORT=$EMAIL_PORT"
              echo "EMAIL=$EMAIL"
              echo "EMAIL_PASSWORD=$EMAIL_PASSWORD"
            } > .env

            export GITHUB_REPOSITORY_OWNER="$GITHUB_REPOSITORY_OWNER"
            export IMAGE_TAG="$IMAGE_TAG"

            docker compose -f docker-compose.dev.yml pull
            docker compose -f docker-compose.dev.yml up -d --remove-orphans

            docker image prune -af --filter until=72h

  # ==========================================
  # JOB 3: Notification in Telegram
  # ==========================================
  notify:
    name: 📩 Send Notification
    needs: [build-and-push, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 📩 Notify in Telegram
        run: |
          BUILD_STATUS="${{ needs.build-and-push.result }}"
          DEPLOY_STATUS="${{ needs.deploy.result }}"

          if [ "$BUILD_STATUS" = "success" ] && [ "$DEPLOY_STATUS" = "success" ]; then
            TEXT="🚧 *Dev deploy successful!* 🚀%0A🌍 https://dev.jinn-travel.com%0A👤 Author: ${{ github.actor }}%0A🔖 Commit: \`${{ github.sha }}\`"
          else
            TEXT="❌ *Dev deploy failed!*%0A👤 Author: ${{ github.actor }}%0A⚙️ Build: $BUILD_STATUS | Deploy: $DEPLOY_STATUS"
          fi

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=$TEXT" \
            -d "parse_mode=Markdown"
