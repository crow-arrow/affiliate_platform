name: Deploy Affiliate Platform (dev)

on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: 🔄 Checkout repository
        uses: actions/checkout@v4

      - name: 🔐 Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ========================
      # BUILD & PUSH DOCKER IMAGES
      # ========================
      - name: 📦 Build and push Server image (Dev)
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/partner-server-dev:latest

      - name: 📦 Build and push Client image (Dev)
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/partner-client-dev:latest
          build-args: |
            VITE_CLERK_PUBLISHABLE_KEY=${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_SHOW_DEV_BANNER=${{ vars.VITE_SHOW_DEV_BANNER }}

      # ========================
      # DEPLOY TO VPS (DOCKER COMPOSE)
      # ========================
      - name: 🚛 Upload docker-compose.dev.yml to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.dev.yml"
          target: "/opt/dev.jinn-travel.com"

      - name: 🚀 Deploy via Docker Compose (Dev)
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /opt/dev.jinn-travel.com

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            export GITHUB_REPOSITORY_OWNER="${{ github.repository_owner }}"
            export DATABASE_URL="${{ secrets.DATABASE_URL }}"

            docker compose -f docker-compose.dev.yml pull
            docker compose -f docker-compose.dev.yml up -d --remove-orphans

            docker image prune -f

      # ========================
      # TELEGRAM NOTIFICATION
      # ========================
      - name: 📩 Notify in Telegram
        if: always()
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then
            MESSAGE="🚧 *Dev deploy successful!* 🚀%0A🌍 [Development](https://dev.jinn-travel.com)%0A👤 Author: ${{ github.actor }}%0A💬 Commit: ${{ github.event.head_commit.message }}"
          else
            MESSAGE="❌ *Dev deploy failed!*%0A👤 Author: ${{ github.actor }}%0A💬 Commit: ${{ github.event.head_commit.message }}"
          fi

          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -H "Content-Type: application/json" \
            -d "{
              \"chat_id\": \"${{ secrets.TELEGRAM_CHAT_ID }}\",
              \"text\": \"$MESSAGE\",
              \"parse_mode\": \"Markdown\"
            }"
