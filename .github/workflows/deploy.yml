name: Build and Deploy Affiliate Platform

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      # ========================
      # GIT + NODE SETUP
      # ========================
      - name: 🔄 Checkout repository
        uses: actions/checkout@v3

      - name: 🧩 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "22"

      - name: ♻️ Cache node_modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('client/package-lock.json', 'server/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # ========================
      # FRONTEND BUILD
      # ========================
      - name: 📦 Install frontend dependencies
        working-directory: client
        run: npm install --legacy-peer-deps

      - name: ⚙️ Build frontend
        working-directory: client
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_SHOW_DEV_BANNER: ${{ vars.VITE_SHOW_DEV_BANNER }}
        run: npm run build

      # ========================
      # BACKEND TESTS
      # ========================
      - name: 📦 Install backend dependencies
        working-directory: server
        run: npm install --legacy-peer-deps

      # ========================
      # DEPLOY FRONTEND
      # ========================
      - name: 🧹 Clean target directory on server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            find /var/www/partner.jinn-travel.com/ -type f \( -name '*.js' -o -name '*.css' -o -name '*.html' -o -name '*.map' \) -delete
            rm -rf /var/www/partner.jinn-travel.com/assets

      - name: 🚀 Deploy builded frontend
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "client/dist"
          target: "/var/www/partner.jinn-travel.com"
          strip_components: 2

      - name: 🔄 Reload Nginx
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            sudo nginx -t && sudo systemctl reload nginx

      # ========================
      # DEPLOY BACKEND
      # ========================
      - name: 🚛 Upload backend code
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "server"
          target: "/opt/partner.jinn-travel.com"
          strip_components: 1

      - name: 📦 Install backend dependencies on server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd "/opt/partner.jinn-travel.com"
            npm install --production --legacy-peer-deps
            npx prisma generate

      - name: 🗄️ Run Prisma migrations
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd "/opt/partner.jinn-travel.com"
            npx prisma migrate deploy

      - name: 🔁 Restart PM2 backend process
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: pm2 restart affiliate_server --update-env

      # ========================
      # TELEGRAM NOTIFICATION
      # ========================
      - name: 📩 Notify in Telegram
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -H "Content-Type: application/json" \
            -d '{
              "chat_id": "${{ secrets.TELEGRAM_CHAT_ID }}",
              "text": "✅ *Main* deploy successful!\n🌍 [Production](https://partner.jinn-travel.com)\n👤 Author: ${{ github.actor }}\n💬 Commit: ${{ github.event.head_commit.message }}",
              "parse_mode": "Markdown"
            }'
